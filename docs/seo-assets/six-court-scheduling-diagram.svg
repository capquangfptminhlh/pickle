<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Sơ đồ kiểm tra lịch thi đấu pickleball sáu sân</title>
<desc id="desc">Sáu sân xếp thành hai hàng, một trận đang chiếm sân số một và cảnh báo kiểm tra trùng vận động viên giữa các sân.</desc>
<rect width="1200" height="675" fill="#f5f8fb"/>
<text x="64" y="73" fill="#17324d" font-family="Arial,sans-serif" font-weight="bold" font-size="37">XẾP LỊCH PICKLEBALL 6 SÂN</text>
<text x="64" y="112" fill="#476178" font-family="Arial,sans-serif" font-size="23">Kiểm tra sân • vận động viên • nghỉ giữa trận • phiên bản lịch</text>
<g font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
