<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pickleup.vn">
  <link rel="apple-touch-icon" href="../assets/app-icon-v2.svg">
  <meta name="theme-color" content="#f4f7f4">
  <title>Check-in | Pickleup.vn</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../assets/app-icon-v2.svg" type="image/svg+xml">
  <script src="../assets/theme.js?v=1"></script>
<link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="../assets/public.css">
<link rel="stylesheet" href="../assets/site-sport.css?v=5">
<link rel="stylesheet" href="../assets/site-light.css?v=1">

<body class="public-body checkin-body site-sport">
<a class="site-skip-link" href="#site-main">Đến nội dung chính</a>
  <main class="checkin-shell" id="site-main" tabindex="-1">
    <a class="public-brand checkin-brand" href="index.html" aria-label="Pickleup.vn"><img class="brand-logo" src="../assets/pickleup-logo-v2.svg" alt="Pickleup.vn"></a>
    <section class="checkin-card">
      <div id="checkinState" class="checkin-state-icon">…</div>
      <span class="eyebrow">TOURNAMENT CHECK-IN</span>
      <h1 id="checkinTeam">Đang kiểm tra...</h1>
      <p id="checkinMeta">Vui lòng chờ.</p>
      <div id="checkinStatus"></div>
      <button id="confirmCheckin" class="btn primary" type="button" hidden>Xác nhận check-in</button>
      <a class="btn secondary" href="index.html" style="text-decoration:none">Về trang giải đấu</a>
      <p id="checkinNote" class="checkin-note">BTC hoặc trọng tài đang đăng nhập có thể xác nhận trực tiếp trên thiết bị này.</p>
    </section>
  </main>
  <script src="preview-api.js"></script>
  <script src="../assets/checkin.js"></script>
  <script src="preview-pwa.js"></script>
</body>
