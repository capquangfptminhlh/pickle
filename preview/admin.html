<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b7a4b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../assets/app-icon.svg" type="image/svg+xml">
  <title>Pickle Tour Admin</title>
  <meta name="description" content="Quản trị giải đấu pickleball, lịch đấu, nhập điểm, bảng xếp hạng và bracket.">  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="../assets/styles.css">
</head>
<body><script src="preview-guard.js"></script>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div><strong>PICKLE TOUR</strong><span>TOURNAMENT OS</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-bottom">
        <div class="role-label">Đăng nhập
          <strong id="userName" style="color:#fff;font-size:13px">...</strong>
          <span id="userRole">...</span>
        </div>
        <button class="ghost" id="logoutBtn">Đăng xuất</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Mở menu">☰</button>
          <div>
            <h1 id="pageTitle">Tổng quan</h1>
            <p id="pageSub">Điều hành giải đấu theo thời gian thực</p>
          </div>
        </div>
        <div class="top-actions">
          <a class="mini" href="index.html" style="text-decoration:none">Trang công khai</a>
          <span class="live-pill"><i></i> LIVE</span>
          <button class="btn primary" id="quickTournament">＋ Tạo giải</button>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <dialog id="scoreDialog" class="score-dialog">
    <form method="dialog" class="score-card" id="scoreForm">
      <div class="score-head">
        <div>
          <span id="scoreMeta" class="eyebrow"></span>
          <h2 id="scoreTitle">Nhập điểm</h2>
        </div>
        <button class="icon-btn" value="cancel" aria-label="Đóng">✕</button>
      </div>

      <div id="scoreSets" class="set-history"></div>

      <div class="score-board">
        <div class="team-row">
          <div><small>ĐỘI A</small><strong id="teamAName"></strong></div>
          <div class="score-control">
            <button type="button" data-score="a" data-delta="-1">−</button>
            <span id="scoreA">0</span>
            <button type="button" data-score="a" data-delta="1">＋</button>
          </div>
        </div>
        <div class="team-row">
          <div><small>ĐỘI B</small><strong id="teamBName"></strong></div>
          <div class="score-control">
            <button type="button" data-score="b" data-delta="-1">−</button>
            <span id="scoreB">0</span>
            <button type="button" data-score="b" data-delta="1">＋</button>
          </div>
        </div>
      </div>

      <div class="score-options">
        <label>Điểm thắng set
          <select id="targetScore">
            <option value="11">11 điểm</option>
            <option value="15">15 điểm</option>
            <option value="21">21 điểm</option>
          </select>
        </label>
        <label><input id="winByTwo" type="checkbox" checked> Thắng cách 2</label>
      </div>

      <div class="score-actions">
        <button type="button" class="btn secondary" id="undoScore">↶ Undo</button>
        <button type="button" class="btn dark" id="finishSet">Hoàn tất set</button>
        <button type="button" class="btn primary" id="finishMatch">Kết thúc trận</button>
      </div>
      <p class="score-note">Mọi thay đổi kết quả được lưu trên server và ghi audit log.</p>
    </form>
  </dialog>

  <dialog id="genericDialog" class="generic-dialog">
    <form method="dialog" class="modal-card" id="genericForm">
      <div class="score-head">
        <h2 id="genericTitle">Tạo mới</h2>
        <button class="icon-btn" value="cancel">✕</button>
      </div>
      <div id="genericBody"></div>
    </form>
  </dialog>

  
  <script src="preview-api.js"></script>
  <script src="../assets/csv-import.js"></script>
  <script src="../assets/admin-modules.js"></script>
  <script src="../assets/bracket-ui.js"></script>
  <script src="../assets/admin-crud.js"></script>
  <script src="../assets/admin-app.js"></script>
  <script src="../assets/ui-motion.js"></script>
  <script src="preview-pwa.js"></script>
</body>
</html>
