<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f4">
  <meta name="robots" content="noindex,nofollow">
  <title>Trận đấu | Pickleup.vn</title>
  <link rel="icon" href="assets/app-icon-v2.svg" type="image/svg+xml">
  <script src="assets/theme.js?v=1"></script>
<link rel="stylesheet" href="assets/match-live.css?v=1">
<link rel="stylesheet" href="assets/site-sport.css?v=9">
<link rel="stylesheet" href="assets/site-light.css?v=1">
<link rel="stylesheet" href="assets/theme.css?v=2">
<link rel="preload" href="assets/fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/typography.css?v=1">
</head>
<body class="site-sport match-screen">
<a class="site-skip-link" href="#matchApp">Đến nội dung chính</a>
  <header class="match-topbar">
    <a href="/" class="brand"><img src="assets/app-icon-v2.svg" alt=""><span><b>PICKLEUP.VN</b><small>TỈ SỐ TRỰC TIẾP</small></span></a>
    <span id="matchConnection" class="live-pill">● Đang kết nối…</span>
  </header>

  <main id="matchApp" class="match-shell" tabindex="-1">
    <section id="matchLoading" class="match-empty"><div>🏓</div><strong>Đang tải trận đấu...</strong></section>
    <section id="matchNotFound" class="match-empty" hidden><div>🔒</div><strong>Không tìm thấy trận</strong><span>Trận chưa được công khai hoặc đã bị hủy. Hỏi BTC nếu bạn vừa quét QR tại sân.</span><a href="/">Về trang giải đấu</a></section>
    <section id="matchCard" class="live-match-card" hidden>
      <div class="match-meta-row">
        <div><small id="matchTournament">GIẢI ĐẤU</small><strong id="matchStage">—</strong></div>
        <span id="matchState" class="state-pill">CHỜ</span>
      </div>
      <div class="court-banner"><span>SÂN</span><strong id="matchCourt">—</strong><small id="matchTime">—</small></div>
      <div class="match-score-grid">
        <article><small>ĐỘI A</small><strong id="matchTeamA">—</strong><b id="matchScoreA">0</b></article>
        <div class="vs">VS</div>
        <article class="right"><small>ĐỘI B</small><strong id="matchTeamB">—</strong><b id="matchScoreB">0</b></article>
      </div>
      <div id="serveInfo" class="serve-info" hidden></div>
      <div id="setList" class="set-list"></div>
      <div class="match-foot"><span id="matchUpdated">Cập nhật realtime</span><a id="tournamentLink" href="#">Xem toàn bộ giải →</a></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="assets/api.js?v=57"></script>
  <script src="assets/match-format.js?v=7"></script>
  <script src="assets/team-lineup.js?v=6"></script>
  <script src="assets/match-live.js?v=5"></script>
</body>
</html>
