<html lang="vi">
<head>
  <meta charset="utf-8">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="description" content="Bảng xếp hạng rating VĐV pickleball trên Pickle Tour.">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/public.css">

<body class="public-body community-public ranking-app-page">
<header class="public-header community-appbar">
  <div class="public-container public-nav">
    <a class="public-brand" href="/"><span class="brand-mark">P</span><span><b>PICKLE TOUR</b><small>CỘNG ĐỒNG PICKLEBALL</small></span></a>
    <nav><a href="/#community">Cộng đồng</a><a href="/#tournaments">Giải đấu</a><a href="/ranking.html">BXH</a><a href="/#connect">Người chơi</a></nav>
    <a class="btn primary" href="/login">Đăng nhập quản trị</a>
  </div>
</header>
<main class="ranking-app-main">
  <section class="public-container ranking-app-shell">
    <div class="ranking-app-title"><div><span>BẢNG XẾP HẠNG</span><h1>Cộng đồng Pickleball</h1><p>Rating được lấy từ dữ liệu VĐV đã xác nhận.</p></div></div>
    <div class="ranking-tabs"><button class="active" type="button" data-rank-mode="player">Cá nhân</button><button type="button" data-rank-mode="club">CLB</button><button type="button" data-rank-mode="area">Khu vực</button></div>
    <div id="rankingPodium" class="ranking-podium"></div>
    <div class="ranking-search-panel">
      <div class="ranking-search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="rankSearch" placeholder="Tìm VĐV hoặc CLB..."></div>
      <select id="rankGender"><option value="">Tất cả giới tính</option><option value="male">Nam (2.5)</option><option value="female">Nữ (2.0)</option></select>
      <select id="rankClub"><option value="">Tất cả CLB</option></select>
    </div>
    <div class="ranking-list-card">
      <div class="ranking-list-head"><span>Hạng</span><span>VĐV</span><span>Rating</span></div>
      <div id="rankingRows"></div>
    </div>
  </section>
</main>
<footer class="public-footer"><div class="public-container"><b>PICKLE TOUR</b><span>Ranking theo dữ liệu đã xác nhận</span></div></footer>
