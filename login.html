<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pickleup.vn">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f4f7f4">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="assets/app-icon-v2.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/app-icon-v2.svg" sizes="192x192">
  <title>Đăng nhập | Pickleup.vn</title>
  <script src="assets/theme.js?v=1"></script>
<link rel="stylesheet" href="assets/styles.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,rgba(216,255,103,.18),transparent 30%),#0d2118;padding:20px}
    .login-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
    .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.login-brand small{display:block;color:#708078;margin-top:2px}
    .login-card h1{margin:0 0 8px;font-size:28px}.login-card>p{color:#708078;margin:0 0 22px}
    .login-form{display:grid;gap:14px}.login-form label{display:grid;gap:7px;font-size:12px;color:#62756a;font-weight:700}
    .login-form input{border:1px solid #dbe5df;border-radius:12px;padding:13px 14px;font-size:15px}
    .login-form button{margin-top:5px}.login-error{min-height:18px;color:#b32b37;font-size:12px}
  </style>
  <link rel="stylesheet" href="assets/pickleup-ui.css?v=5">
<link rel="stylesheet" href="assets/site-sport.css?v=6">
<link rel="stylesheet" href="assets/site-light.css?v=1">
<link rel="stylesheet" href="assets/theme.css?v=2">
</head>
<body class="site-sport login-screen">
<a class="site-skip-link" href="#site-main">Đến nội dung chính</a>
  <main class="login-card" id="site-main" tabindex="-1">
    <div class="login-brand"><img class="brand-mark brand-mark-img" src="assets/app-icon-v2.svg" alt="Pickleup.vn"><div><b>PICKLEUP.VN</b><small>Cộng đồng Pickleball</small></div></div>
    <h1>Đăng nhập quản trị</h1>
    <p>Super Admin, BTC, Quản lý CLB, Thu ngân và Trọng tài sử dụng tài khoản được cấp.</p>
    <form id="loginForm" class="login-form">
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label>
      <div id="error" class="login-error"></div>
      <button class="btn primary" type="submit">Đăng nhập</button>
    </form>
    <a class="login-home-link" href="/">← Về trang chủ</a>
  </main>
  <script src="assets/api.js?v=45"></script>
  <script src="assets/login.js?v=2"></script>
  <script src="/assets/pwa.js"></script>
</body>
</html>
