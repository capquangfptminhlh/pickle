<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7b50"><title>PickleUp · Open Play</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f2f6f3;color:#153126}main{max-width:820px;margin:auto;padding:20px}h1{margin:0}p{line-height:1.5;color:#506d5d}
section{background:white;border:1px solid #dce7e0;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-weight:650;margin:12px 0 5px}
input,textarea{font:inherit;width:100%;border:1px solid #bbcfc2;border-radius:10px;padding:12px;min-height:44px}
textarea{min-height:180px}button{border:0;border-radius:12px;background:#0b7b50;color:#fff;font:inherit;font-weight:700;padding:13px 20px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.result{background:#eaf7ef;padding:12px;border-radius:12px;white-space:pre-wrap}
li{padding:7px 0}a{color:#096f49}@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><main><a href="/">← PickleUp</a><section><h1>Open Play · Ghép đôi theo trình</h1>
<p>Công cụ mô phỏng riêng, chưa đăng ký hay thay đổi dữ liệu giải đấu. Nhập mỗi VĐV một dòng: <strong>Mã, điểm trình</strong> (ví dụ A01,2.5). Tối đa 16 người mỗi lượt.</p>
<label for="players">Danh sách VĐV</label><textarea id="players" spellcheck="false">A01,2.5
A02,2.7
A03,2.2
A04,3.0</textarea>
<div class="grid"><div><label for="limit">Tổng điểm tối đa</label><input id="limit" type="number" min="1" max="16" step="0.1" value="5.2"></div>
<div><label for="tolerance">Dung sai</label><input id="tolerance" type="number" min="0" max="0.5" step="0.1" value="0"></div></div>
<p><button id="generate" type="button">Ghép đôi</button> <button id="exportPairs" type="button" disabled>Xuất CSV</button></p><div id="result" role="status" aria-live="polite" class="result">Chưa ghép đôi.</div></section></main>
<script type="module" src="assets/open-play-page.js"></script></body></html>
