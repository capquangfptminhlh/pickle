<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2118"><title>Đang ngoại tuyến | Pickle Tour</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d2118;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:24px}
main{width:min(460px,100%);text-align:center}.ball{width:88px;height:88px;border-radius:50%;background:#dfff69;margin:0 auto 24px;box-shadow:0 0 0 16px rgba(223,255,105,.08);animation:p 1.8s ease-in-out infinite}
h1{font-size:32px;margin:0 0 12px}p{color:#a8beb2;line-height:1.6}.btn{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:12px;background:#dfff69;color:#0d2118;text-decoration:none;font-weight:800}
@keyframes p{50%{transform:translateY(-8px);box-shadow:0 0 0 24px rgba(223,255,105,.03)}}@media(prefers-reduced-motion:reduce){.ball{animation:none}}
</style>
</head><body><main><div class="ball"></div><h1>Không có kết nối</h1><p>Pickle Tour vẫn mở được app shell. Dữ liệu live và thao tác ghi điểm cần kết nối mạng để đồng bộ an toàn.</p><a class="btn" href="/">Thử kết nối lại</a></main></body></html>
