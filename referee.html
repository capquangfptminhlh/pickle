<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f4f7f4">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="assets/app-icon-v2.svg" type="image/svg+xml">
  <title>Courtside Referee | Pickleup.vn</title>
  <script src="assets/theme.js?v=1"></script>
<link rel="stylesheet" href="assets/courtside.css?v=1">
<link rel="stylesheet" href="assets/site-sport.css?v=9">
<link rel="stylesheet" href="assets/site-light.css?v=1">
<link rel="stylesheet" href="assets/theme.css?v=2">
<link rel="preload" href="assets/fonts/barlow-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/typography.css?v=1">
<link rel="stylesheet" href="assets/referee-arena.css?v=4">
<link rel="stylesheet" href="assets/timeout-clock.css?v=1">
<link rel="stylesheet" href="assets/team-lineup.css?v=5">
</head>
<body class="courtside-body site-sport referee-arena">
<a class="site-skip-link" href="#site-main">Đến nội dung chính</a>
  <header class="courtside-top">
    <div class="courtside-brand">
      <img src="assets/app-icon-v2.svg" alt="">
      <div><strong>PICKLEUP.VN</strong><small>TRỌNG TÀI · COURTSIDE</small></div>
    </div>
    <div class="courtside-top-actions">
      <span id="connectionState" class="connection-pill">Đang kết nối</span>
      <button id="refreshBtn" class="icon-action" type="button" aria-label="Làm mới">↻</button>
      <a id="headRosterLink" class="icon-action" href="admin.html" hidden aria-label="Danh sách VĐV">Danh sách VĐV</a>
      <a class="icon-action" href="admin.html" aria-label="Quản trị">☰</a>
    </div>
  </header>

  <main class="courtside-main" id="site-main" tabindex="-1">
    <section id="refSummary" class="ref-summary"></section>
    <section id="matchPicker" class="match-picker"></section>

    <section id="scoreSurface" class="score-surface" hidden>
      <div class="score-context">
        <button id="backToMatches" class="back-link" type="button">← Danh sách trận</button>
        <div><span id="courtLabel"></span><b id="stageLabel"></b></div>
        <span id="queueLabel" class="queue-pill"></span>
      </div>

      <div class="serve-banner">
        <span>ĐANG GIAO</span>
        <strong id="serveBanner">—</strong>
        <small id="modeBanner">Side-out</small>
        <small id="legBanner" class="leg-banner" hidden></small>
      </div>

      <section id="refRelayDrawPanel" class="relay-draw-panel" aria-label="Bốc thăm cặp thi đấu" hidden><b>THỨ TỰ CẶP THI ĐẤU</b><div class="relay-draw-orders" aria-live="polite"></div><button id="refRelayDrawButton" type="button" class="btn primary" data-relay-draw>Bốc thăm thứ tự cặp</button></section>
      <div id="refRules" class="ref-rules" aria-label="Luật thi đấu"></div>
      <div class="ref-game-line"><span id="refGameLabel">GAME 1</span><span id="refGameWins"></span></div>

      <div class="ref-score-grid">
        <article class="ref-team-card team-a">
          <div class="ref-team-head"><small>BÊN A <span class="ref-serving" hidden>● GIAO</span></small><strong id="refTeamA">—</strong><span class="ref-team-roster" id="refRosterA"></span></div>
          <div class="ref-score-wrap"><div id="refScoreA" class="ref-score">0</div><span class="ref-point-feedback" aria-hidden="true"></span></div>
          <button class="rally-hit" type="button" data-rally="A" aria-label="Đội A thắng rally"><span aria-hidden="true">+</span> THẮNG RALLY</button>
          <div class="score-correct">
            <button type="button" data-correct="A" data-delta="-1" aria-label="Sửa điểm đội A, trừ 1">−1</button>
            <button type="button" data-correct="A" data-delta="1" aria-label="Sửa điểm đội A, cộng 1">+1</button>
          </div>
        </article>

        <article class="ref-team-card team-b">
          <div class="ref-team-head"><small>BÊN B <span class="ref-serving" hidden>● GIAO</span></small><strong id="refTeamB">—</strong><span class="ref-team-roster" id="refRosterB"></span></div>
          <div class="ref-score-wrap"><div id="refScoreB" class="ref-score">0</div><span class="ref-point-feedback" aria-hidden="true"></span></div>
          <button class="rally-hit" type="button" data-rally="B" aria-label="Đội B thắng rally"><span aria-hidden="true">+</span> THẮNG RALLY</button>
          <div class="score-correct">
            <button type="button" data-correct="B" data-delta="-1" aria-label="Sửa điểm đội B, trừ 1">−1</button>
            <button type="button" data-correct="B" data-delta="1" aria-label="Sửa điểm đội B, cộng 1">+1</button>
          </div>
        </article>
      </div>

      <div id="setHistory" class="set-strip"></div>
      <div id="scoreHint" class="score-hint" hidden></div>

      <div class="ref-controls">
      <section class="ref-control-card">
        <div class="control-title"><span>Quyền giao</span><small id="serverHelp">Chỉnh khi trọng tài cần sửa</small></div>
        <div id="serviceButtons" class="service-buttons">
          <button type="button" data-service="A" data-server="1">A · S1</button>
          <button type="button" data-service="A" data-server="2">A · S2</button>
          <button type="button" data-service="B" data-server="1">B · S1</button>
          <button type="button" data-service="B" data-server="2">B · S2</button>
        </div>
      </section>

      <section class="ref-control-card">
        <div class="control-title"><span>Hội ý & y tế</span><small>Số lần đã sử dụng / giới hạn</small></div>
        <section id="refTimeoutClock" class="timeout-clock" aria-label="Đồng hồ timeout" hidden>
          <span data-timeout-label></span><strong data-timeout-value role="timer" aria-live="off"></strong>
          <span data-timeout-status role="status" aria-live="polite"></span>
          <div class="timeout-clock-track" aria-hidden="true"><i data-timeout-progress></i></div>
        </section>
        <div class="timeout-grid">
          <button type="button" data-timeout="A" data-kind="standard">Hội ý A <b id="refTimeoutA">0/2</b></button>
          <button type="button" data-timeout="B" data-kind="standard">Hội ý B <b id="refTimeoutB">0/2</b></button>
          <button type="button" data-timeout="A" data-kind="medical">Y tế A <b id="refMedicalA">0/1</b></button>
          <button type="button" data-timeout="B" data-kind="medical">Y tế B <b id="refMedicalB">0/1</b></button>
        </div>
      </section>
      </div>

      <div class="ref-bottom-actions">
        <button id="resetMatchBtn" class="ref-btn danger" type="button" aria-label="Đặt lại toàn bộ bảng điểm trận này">↺ Đặt lại</button>
        <button id="undoBtn" class="ref-btn secondary" type="button" aria-label="Hoàn tác thao tác vừa thực hiện">↶ Undo</button>
        <button id="finishSetBtn" class="ref-btn dark" type="button">Chốt set</button>
        <button id="finishMatchBtn" class="ref-btn primary" type="button">Kết thúc trận</button>
      </div>
    </section>
  </main>

  <div id="refToast" class="ref-toast" hidden></div>
  <div id="refAnnouncement" class="ref-announcement" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="assets/api.js?v=57"></script>
  <script src="assets/match-format.js?v=7"></script>
  <script src="assets/team-lineup.js?v=8"></script>
  <script src="assets/timeout-clock.js?v=1"></script>
  <script src="assets/referee-courtside.js?v=17"></script>
  <script src="/assets/pwa.js"></script>
</body>
</html>
