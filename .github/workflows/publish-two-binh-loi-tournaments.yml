name: Publish two Bình Lợi tournaments

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-two-binh-loi-tournaments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts
      - name: Upsert both public tournaments
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(cat <<'SQL'
          UPDATE tournaments
          SET poster_url='/assets/tournaments/pickleup-tour-binh-loi-20261015-original.jpg?v=6',
              public_visible=1,status='registration',is_featured=1,featured_rank=100,
              updated_at=datetime('now')
          WHERE id='tour-pickleup-binh-loi-20261015';

          INSERT INTO tournaments(
            id,owner_user_id,name,slug,venue_name,start_at,end_at,status,public_visible,
            is_featured,featured_rank,contact_name,contact_phone,contact_email,
            prize_pool,entry_fee,poster_url,sponsor_package,created_at,updated_at
          ) VALUES(
            'tour-xe-tui-mu-mlp-20261011',NULL,'XÉ TÚI MÙ – MLP CHỊ ĐẸP 20/10','xe-tui-mu-mlp-chi-dep-20261011',
            'Bình Lợi Pickleball, 171/4 Bình Lợi, Bình Lợi Trung, TP.HCM',
            '2026-10-11T09:00:00.000Z','2026-10-11T11:00:00.000Z','registration',1,1,90,
            'Hậu / Khoa','0968976902 / 0947669929','',
            'Vô địch: 1.000.000đ + 3 cup + 3 huy chương + quà NTT (nếu có); Á quân: 500.000đ + 3 cup + 3 huy chương + quà NTT; Hạng ba: 300.000đ + 3 cup + 3 huy chương + quà NTT',
            '200.000đ / VĐV','/assets/tournaments/xe-tui-mu-mlp-chi-dep-20261011-original.jpg?v=6','free',
            datetime('now'),datetime('now')
          )
          ON CONFLICT(id) DO UPDATE SET
            name=excluded.name,slug=excluded.slug,venue_name=excluded.venue_name,
            start_at=excluded.start_at,end_at=excluded.end_at,status='registration',
            public_visible=1,is_featured=1,featured_rank=90,
            contact_name=excluded.contact_name,contact_phone=excluded.contact_phone,
            prize_pool=excluded.prize_pool,entry_fee=excluded.entry_fee,
            poster_url=excluded.poster_url,sponsor_package=excluded.sponsor_package,
            updated_at=datetime('now');

          INSERT INTO divisions(
            id,tournament_id,name,event_type,format,best_of,points_to_win,win_by_two,
            advance_count,tie_break_mode,scoring_mode,minimum_rest_minutes,match_slot_minutes,active,updated_at
          ) VALUES(
            'division-xe-tui-mu-mlp-20261011','tour-xe-tui-mu-mlp-20261011',
            'MLP Team • 3 Nữ / Team • AB–BC–CA • Bốc thăm ngẫu nhiên','team','round_robin',
            3,9,0,1,'head_to_head','rally',10,20,1,datetime('now')
          )
          ON CONFLICT(id) DO UPDATE SET
            name='MLP Team • 3 Nữ / Team • AB–BC–CA • Bốc thăm ngẫu nhiên',
            event_type='team',format='round_robin',best_of=3,points_to_win=9,win_by_two=0,
            active=1,updated_at=datetime('now');

          UPDATE teams
          SET group_code = NULL
          WHERE division_id = 'division-xe-tui-mu-mlp-20261011'
            AND (SELECT COUNT(*) FROM matches WHERE division_id = 'division-xe-tui-mu-mlp-20261011') = 0;
          SQL
          )
          npx wrangler d1 execute DB --remote --command "$SQL"
      - name: Verify both are public
        run: |
          BODY="$(curl -fsS https://pickleup.vn/api/public/state)"
          grep -q 'tour-pickleup-binh-loi-20261015' <<<"$BODY"
          grep -q 'tour-xe-tui-mu-mlp-20261011' <<<"$BODY"
