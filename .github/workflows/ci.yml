name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pickle
          POSTGRES_USER: pickle
          POSTGRES_PASSWORD: pickle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pickle -d pickle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pickle:pickle_ci@127.0.0.1:5432/pickle
      JWT_SECRET: ci-secret-only-not-production-32chars-plus
      ADMIN_EMAIL: admin@pickle.test
      ADMIN_PASSWORD: ci-password-123
      NODE_ENV: test
      PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Dependency audit (including test tools)
        run: npm audit --audit-level=high
      - name: Install Chromium for UI smoke tests
        run: npx playwright install --with-deps chromium
      - name: Theme preference and first offline load
        run: node --test scripts/registry-theme.test.mjs
      - name: Player avatar create and retry flow
        run: node scripts/registry-player-avatar-ui.mjs
      - name: Registry desktop and mobile browser regressions
        run: |
          node scripts/registry-ui.mjs
          node scripts/registry-accounts-ui.mjs
          node scripts/registry-operator-center-ui.mjs
          node scripts/registry-draw-reset-ui.mjs
          node scripts/registry-court-scheduling-ui.mjs
          node scripts/registry-timeout-clock-ui.mjs
          node scripts/registry-relay-draw-ui.mjs
          node scripts/registry-lifecycle-ui.mjs
          node scripts/registry-role-pages-ui.mjs
          node --test scripts/registry-tournament-progress.test.mjs scripts/registry-tournament-recovery-ui.mjs
          node --test scripts/registry-api-client.test.mjs
          node --test scripts/registry-team-lineup.test.mjs
          node --test scripts/registry-series-ui.test.mjs
          node --test scripts/registry-completed-score.test.mjs
          node scripts/registry-series-browser.mjs
          node scripts/registry-mlp-championship-ui.mjs
          node scripts/registry-scoring-ui.mjs
          node scripts/registry-referee-arena-ui.mjs
          node scripts/mlp-court-control-ui.mjs
          node scripts/registry-legacy-ui.mjs
          node scripts/registry-design-ui.mjs
          node scripts/registry-site-design-ui.mjs
          SITE_THEME=light node scripts/registry-site-design-ui.mjs
          DESIGN_THEME=light node scripts/registry-design-ui.mjs
          SITE_MOTION=no-preference SITE_WIDTH=375 node scripts/registry-site-design-ui.mjs
          SITE_THEME=light SITE_MOTION=no-preference SITE_WIDTH=375 node scripts/registry-site-design-ui.mjs
          DESIGN_MOTION=no-preference node scripts/registry-design-ui.mjs
          node --test scripts/registry-motion-ui.test.mjs scripts/registry-realtime.test.mjs scripts/registry-draw-ui.test.mjs scripts/registry-checkin-ui.test.mjs scripts/ui-smoke-readiness.test.mjs scripts/registry-image-shrink.test.mjs scripts/registry-poster-variants.test.mjs
          node --test scripts/registry-network-ui.test.mjs
      - name: Syntax check
        run: |
          node --check server/index.js
          node --check server/seed.js
          node --check assets/admin-app.js
          node --check assets/player-avatar-input.js
          node --check assets/referee-courtside.js
          node --check assets/timeout-clock.js
          node --check assets/team-lineup.js
          node --check assets/court-board.js
          node --check assets/legacy-migrate.js
          node --check assets/match-live.js
          node --check assets/admin-modules.js
          node --check assets/admin-crud.js
          node --check assets/player-picker.js
          node --check shared/team-player-selection.js
          node --check shared/scoring-rules.js
          node --check shared/relay-draw.js
          node --check assets/public.js
          node --check assets/player.js
          node --check assets/checkin.js
          node --check assets/pwa.js
          node --check assets/api.js
          node --check assets/login.js
          node --check preview/preview-guard.js
          node --check preview/preview-api.js
          node --check scripts/e2e.mjs
          node --check scripts/ui-smoke.mjs
      - name: Design system guard
        run: |
          if grep -Eq '(^|[^$])\$\(selectors\)\.forEach' assets/ui-motion.js; then
            echo "Broken ui-motion selector helper detected"
            exit 1
          fi
          if grep -R "mobile-native.css" -- *.html preview/*.html; then
            echo "Obsolete mobile-native.css reference detected"
            exit 1
          fi
          if grep -q -- "--n-bg:" assets/styles.css assets/public.css; then
            echo "Obsolete native-dark tokens detected in core styles"
            exit 1
          fi
          if grep -q "Native Mobile UI" assets/styles.css assets/public.css; then
            echo "Obsolete native-dark theme block detected"
            exit 1
          fi
          if grep -q "MOBILE SPORTS APP" assets/styles.css; then
            echo "Conflicting dark sports app override detected"
            exit 1
          fi
          if grep -q "MOBILE SPORTS PUBLIC" assets/public.css; then
            echo "Conflicting dark public override detected"
            exit 1
          fi
          if grep -R -n '<script>' -- *.html preview/*.html; then
            echo "Inline script detected; CSP requires external JavaScript files"
            exit 1
          fi
      - name: Migrate and seed
        run: |
          npm run migrate
          npm run seed
      - name: Start app
        run: |
          npm start > app.log 2>&1 &
          echo $! > app.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8080/api/public/state >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/public/state
      - name: Login and admin smoke test
        run: |
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"email":"admin@pickle.test","password":"ci-password-123"}' \
            http://127.0.0.1:8080/api/auth/login
          curl -fsS -b cookies.txt http://127.0.0.1:8080/api/admin/state
      - name: End-to-end operations test
        run: node scripts/e2e.mjs
      - name: Registry API and Preview regressions
        run: |
          REGISTRY_TEST_URL=http://127.0.0.1:8080 node scripts/registry-api.mjs
          REGISTRY_TEST_URL=http://127.0.0.1:8080 node scripts/registry-accounts-api.mjs
          REGISTRY_TEST_URL=http://127.0.0.1:8080 node scripts/registry-operations-api.mjs
          REGISTRY_TEST_URL=http://127.0.0.1:8080 node scripts/registry-public-api.mjs
          REGISTRY_TEST_URL=http://127.0.0.1:8080 node scripts/registry-series-api.mjs
          REGISTRY_TEST_URL=http://127.0.0.1:8080 node scripts/registry-relay-draw-api.mjs
          node --test scripts/registry-preview.test.mjs
      - name: Start static preview server
        run: |
          python3 -m http.server 8090 > preview.log 2>&1 &
          echo $! > preview.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8090/preview/index.html >/dev/null && break
            sleep 1
          done
      - name: UI browser smoke test
        run: node scripts/ui-smoke.mjs
      - name: Upload mobile UI screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-screenshots
          path: ui-artifacts
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload UI screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots
          retention-days: 1
          if-no-files-found: ignore
      - name: Show server log on failure
        if: failure()
        run: cat app.log || true
