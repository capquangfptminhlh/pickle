name: Production release audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact build toolchain
        working-directory: cloudflare
        run: npm ci --ignore-scripts
      - name: Rebuild expected release from main
        working-directory: cloudflare
        run: npm run build:assets
      - name: Compare production release and homepage with main
        run: node scripts/audit-production-release.mjs
