name: Open Play E2E
on:
  pull_request:
    branches: [main]
    paths:
      - "open-play*.html"
      - "assets/open-play-*.js"
      - "assets/api.js"
      - "shared/open-play.js"
      - "cloudflare/src/open-play.js"
      - "cloudflare/src/index.js"
      - "cloudflare/migrations/0022_open_play_sessions.sql"
      - "cloudflare/tests/open-play.test.mjs"
      - "scripts/open-play*.mjs"
      - "scripts/registry-open-play-ui.mjs"
      - ".github/workflows/open-play-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  open-play:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Open Play validation
        run: |
          node --test scripts/open-play.test.mjs scripts/open-play-page.test.mjs scripts/open-play-admin.test.mjs scripts/open-play-discover.test.mjs cloudflare/tests/open-play.test.mjs
          node scripts/registry-open-play-ui.mjs
          node scripts/registry-legacy-ui.mjs
