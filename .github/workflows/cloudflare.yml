name: Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "package.json"
      - "package-lock.json"
      - "assets/**"
      - "shared/**"
      - "*.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "scripts/registry-*.mjs"
      - "preview/preview-api.js"
      - ".github/workflows/cloudflare.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - "shared/**"
      - "assets/**"
      - "*.html"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:
    inputs:
      backup_reference:
        description: "Verified external production D1 backup reference"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_PICKLEUP_PRODUCTION to authorize remote migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm ci --ignore-scripts
      - name: Audit Worker dependencies (including development tools)
        working-directory: cloudflare
        run: npm audit --audit-level=high
      - name: iPhone PWA safe-area regression
        run: node --test scripts/pwa-ios-safe-area.test.mjs
      - name: Arena homepage structure and rollout guard
        run: node --test scripts/arena-home-2026.test.mjs
      - name: Arena 360 route, accessibility and cross-module guard
        run: node --test scripts/arena-360.test.mjs
      - name: Courtside client syntax
        run: |
          node --check assets/ui-motion.js
          node --check assets/motion-system.js
          node --check assets/bracket-motion.js
          node --check assets/draw-reveal.js
          node --check assets/draw-flex.js
          node --check assets/public.js
          node --check assets/tournament.js
          node --check assets/player-avatar-input.js
          node --check assets/referee-courtside.js
          node --check assets/timeout-clock.js
          node --check assets/team-lineup.js
          node --check assets/court-board.js
          node --check assets/legacy-migrate.js
          node --check assets/open-play-admin.js
          node --check assets/open-play-discover.js
          node --check assets/open-play-page.js
          node --check assets/match-live.js
      - name: Wrangler dry run
        working-directory: cloudflare
        run: npm run check
      - name: Verify Open Play browser module is packaged
        working-directory: cloudflare
        run: |
          test -s public/shared/open-play.js
          node --check public/shared/open-play.js
      - name: Verify fingerprinted PWA cache and visible release identity
        working-directory: cloudflare
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const release=JSON.parse(readFileSync("public/release.json","utf8"));
          const worker=readFileSync("public/service-worker.js","utf8");
          const index=readFileSync("public/index.html","utf8");
          const admin=readFileSync("public/admin.html","utf8");
          if(!/^pickleup-v86-[0-9a-f]{16}$/.test(release.version))throw new Error("Invalid generated PWA version");
          if(!worker.includes('const VERSION="'+release.version+'";'))throw new Error("PWA script does not match release revision");
          if(!index.includes(release.version)||!admin.includes(release.version))throw new Error("Published pages do not identify their release");
          console.log("STATIC_RELEASE_OK "+release.version);
          NODE
      - name: Multi-court timeline model regressions
        run: node --test scripts/court-timeline.test.mjs
      - name: Registry and Worker regression tests
        working-directory: cloudflare
        run: npm test
      - name: Apply local D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --local
      - name: Run Cloudflare integration smoke test
        working-directory: cloudflare
        run: |
          cat > .dev.vars <<'EOF'
          SESSION_SECRET="cloudflare-local-test-secret-1234567890-abcdef"
          BOOTSTRAP_ADMIN_EMAIL="admin@pickle.test"
          BOOTSTRAP_ADMIN_PASSWORD="cloudflare-test-password-123"
          BOOTSTRAP_ADMIN_NAME="CI Super Admin"
          EOF
          npx wrangler dev --local --port 8787 > /tmp/pickle-wrangler.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/pickle-wrangler.log
            exit 1
          fi
          node scripts/smoke.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node scripts/permissions-v2.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node ../scripts/registry-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node ../scripts/registry-accounts-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node ../scripts/registry-operations-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node ../scripts/registry-public-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node ../scripts/registry-legacy-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node ../scripts/registry-bracket-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node ../scripts/registry-series-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node ../scripts/registry-relay-draw-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node ../scripts/registry-draw-reset-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          REGISTRY_TEST_URL=http://127.0.0.1:8787 node ../scripts/registry-gallery-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node ../scripts/registry-court-safety-api.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }

  deploy:
    needs: validate
    # Production schema migrations need a reviewed backup and explicit release action.
    # A merge to main runs validation only; manual workflow_dispatch performs deployment.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY_PICKLEUP_PRODUCTION' && inputs.backup_reference != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PICKLE_ADMIN_PASSWORD: ${{ secrets.PICKLE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm ci --ignore-scripts
      - name: Build static assets
        working-directory: cloudflare
        run: npm run build:assets
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Ensure media bucket exists
        working-directory: cloudflare
        run: npx wrangler r2 bucket create pickleup-media || true
      - name: Verify manually confirmed D1 backup reference
        env:
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$DEPLOY_CONFIRMATION" = "DEPLOY_PICKLEUP_PRODUCTION"
          test -n "${BACKUP_REFERENCE//[[:space:]]/}"
          echo "Backup reference provided by operator; independently verify that it is restorable."
      - name: Apply D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --remote
      - name: Check whether an active super admin exists
        id: admin_state
        working-directory: cloudflare
        run: |
          if npx wrangler d1 execute DB --remote --command "SELECT role FROM app_users WHERE role='super_admin' AND active=1 LIMIT 1" --json | grep -q 'super_admin'; then
            echo "needs_bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bootstrap=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require bootstrap password only for first admin
        if: steps.admin_state.outputs.needs_bootstrap == 'true'
        run: test -n "$PICKLE_ADMIN_PASSWORD"
      - name: Deploy Worker
        working-directory: cloudflare
        run: npx wrangler deploy
      - name: Configure session secret
        working-directory: cloudflare
        run: |
          if npx wrangler secret list --format json | grep -q '"SESSION_SECRET"'; then
            echo "SESSION_SECRET already configured"
          else
            SESSION_SECRET="$(openssl rand -hex 32)"
            echo "::add-mask::$SESSION_SECRET"
            printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          fi
      - name: Configure one-time bootstrap password
        if: steps.admin_state.outputs.needs_bootstrap == 'true'
        working-directory: cloudflare
        run: printf '%s' "$PICKLE_ADMIN_PASSWORD" | npx wrangler secret put BOOTSTRAP_ADMIN_PASSWORD
      - name: Redeploy with authentication secrets
        working-directory: cloudflare
        run: npx wrangler deploy
      - name: Verify production UI assets and PWA cache after manual deployment
        run: node scripts/audit-production-release.mjs

  # Publish code and static UI after every main merge, but never mutate remote D1.
  # Verify the existing production schema before switching the Worker version.
  deploy-static:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm ci --ignore-scripts
      - name: Verify deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Block automatic deployment when production D1 migrations are pending
        working-directory: cloudflare
        run: |
          npx wrangler d1 execute DB --remote --json --command "SELECT name FROM d1_migrations" > remote-migrations.json
          node scripts/verify-remote-migrations.mjs remote-migrations.json migrations
      - name: Build release assets with content-derived PWA cache version
        working-directory: cloudflare
        run: npm run build:assets
      - name: Deploy compatible Worker and website assets (no D1 writes)
        working-directory: cloudflare
        run: npx wrangler deploy
      - name: Confirm new release is live on pickleup.vn
        working-directory: cloudflare
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const expected=JSON.parse(readFileSync("public/release.json","utf8")).version;
          let lastError="";
          for(let attempt=0;attempt<12;attempt++){
            try{
              const response=await fetch("https://pickleup.vn/release.json?check="+encodeURIComponent(expected),{cache:"no-store",signal:AbortSignal.timeout(8000)});
              if(!response.ok)throw new Error("HTTP "+response.status);
              const current=await response.json();
              if(current.version===expected){console.log("LIVE_RELEASE_VERIFIED "+expected);process.exit(0)}
              lastError="Live version "+current.version+" differs from "+expected;
            }catch(error){lastError=String(error.message||error)}
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          throw new Error("Deployment could not be verified: "+lastError);
          NODE
      - name: Verify production UI assets and PWA cache after static deployment
        run: node scripts/audit-production-release.mjs
