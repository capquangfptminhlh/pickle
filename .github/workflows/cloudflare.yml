name: Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "assets/**"
      - "*.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts
      - name: Wrangler dry run
        working-directory: cloudflare
        run: npm run check
      - name: Apply local D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --local
      - name: Run Cloudflare integration smoke test
        working-directory: cloudflare
        run: |
          cat > .dev.vars <<'EOF'
          SESSION_SECRET="cloudflare-local-test-secret-1234567890-abcdef"
          BOOTSTRAP_ADMIN_EMAIL="admin@pickle.test"
          BOOTSTRAP_ADMIN_PASSWORD="cloudflare-test-password-123"
          BOOTSTRAP_ADMIN_NAME="CI Super Admin"
          EOF
          npx wrangler dev --local --port 8787 > /tmp/pickle-wrangler.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/pickle-wrangler.log
            exit 1
          fi
          node scripts/smoke.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node scripts/permissions.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts
      - name: Build static assets
        working-directory: cloudflare
        run: npm run build:assets
      - name: Verify deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Ensure media bucket exists
        working-directory: cloudflare
        run: npx wrangler r2 bucket create pickleup-media || true
      - name: Apply D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy Worker
        working-directory: cloudflare
        run: npx wrangler deploy
