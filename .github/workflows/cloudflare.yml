name: Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "assets/api.js"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts
      - name: Wrangler dry run
        working-directory: cloudflare
        run: npm run check
      - name: Apply local D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --local
      - name: Run Cloudflare integration smoke test
        working-directory: cloudflare
        run: |
          cat > .dev.vars <<'EOF'
          SESSION_SECRET="cloudflare-local-test-secret-1234567890-abcdef"
          BOOTSTRAP_ADMIN_EMAIL="admin@pickle.test"
          BOOTSTRAP_ADMIN_PASSWORD="cloudflare-test-password-123"
          BOOTSTRAP_ADMIN_NAME="CI Super Admin"
          EOF
          npx wrangler dev --local --port 8787 > /tmp/pickle-wrangler.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/pickle-wrangler.log
            exit 1
          fi
          node scripts/smoke.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }
          node scripts/permissions.mjs || { cat /tmp/pickle-wrangler.log; exit 1; }

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PICKLE_SESSION_SECRET: ${{ secrets.PICKLE_SESSION_SECRET }}
      PICKLE_ADMIN_EMAIL: ${{ secrets.PICKLE_ADMIN_EMAIL }}
      PICKLE_ADMIN_PASSWORD: ${{ secrets.PICKLE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts
      - name: Verify deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PICKLE_SESSION_SECRET"
          test -n "$PICKLE_ADMIN_EMAIL"
          test -n "$PICKLE_ADMIN_PASSWORD"
      - name: Provision bindings and deploy Worker
        working-directory: cloudflare
        run: npx wrangler deploy
      - name: Configure Worker secrets
        working-directory: cloudflare
        run: |
          printf '%s' "$PICKLE_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          printf '%s' "$PICKLE_ADMIN_EMAIL" | npx wrangler secret put BOOTSTRAP_ADMIN_EMAIL
          printf '%s' "$PICKLE_ADMIN_PASSWORD" | npx wrangler secret put BOOTSTRAP_ADMIN_PASSWORD
      - name: Apply D1 migrations
        working-directory: cloudflare
        run: npx wrangler d1 migrations apply DB --remote
      - name: Redeploy after migrations
        working-directory: cloudflare
        run: npx wrangler deploy
