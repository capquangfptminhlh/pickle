name: Legacy Recovery Pages

on:
  push:
    branches: ["main"]
    paths:
      - "legacy-migrate.html"
      - "assets/legacy-migrate.js"
      - "assets/app-icon-v4.svg"
      - ".github/workflows/legacy-recovery-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legacy-recovery-pages
  cancel-in-progress: true

jobs:
  availability:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.site.outputs.enabled }}
    steps:
      - name: Check optional GitHub Pages availability
        id: site
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('enabled', 'false');
              core.notice('GitHub Pages is unavailable. JSON recovery remains available at https://pickleup.vn/legacy-migrate.html.');
            }
  deploy:
    needs: availability
    if: needs.availability.outputs.enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare minimal recovery site
        run: |
          rm -rf _site
          mkdir -p _site/assets
          cp legacy-migrate.html _site/legacy-migrate.html
          cp assets/legacy-migrate.js _site/assets/legacy-migrate.js
          cp assets/app-icon-v4.svg _site/assets/app-icon-v4.svg
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy recovery page
        id: deployment
        uses: actions/deploy-pages@v4
